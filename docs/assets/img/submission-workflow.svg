<svg xmlns="http://www.w3.org/2000/svg" width="680" height="116" viewBox="0 0 680 116" role="img" aria-labelledby="wf-title wf-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="wf-title">FaceBase submission workflow</title>
<desc id="wf-desc">Five sequential steps, left to right: Step 1 biosamples, Step 2 files, Step 3 link files, Step 4 experiments, Step 5 protocol.</desc>
<style>
  .box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .num { fill: #0F6E56; font-size: 12px; font-weight: 400; }
  .lbl { fill: #085041; font-size: 14px; font-weight: 500; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-linecap: round; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #085041; stroke: #5DCAA5; }
    .num { fill: #5DCAA5; }
    .lbl { fill: #9FE1CB; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box" x="40" y="40" width="100" height="56" rx="8"/>
<text class="num" x="90" y="58" text-anchor="middle" dominant-baseline="central">Step 1</text>
<text class="lbl" x="90" y="78" text-anchor="middle" dominant-baseline="central">Biosamples</text>

<line class="arr" x1="146" y1="68" x2="161" y2="68" marker-end="url(#arrowhead)"/>

<rect class="box" x="165" y="40" width="100" height="56" rx="8"/>
<text class="num" x="215" y="58" text-anchor="middle" dominant-baseline="central">Step 2</text>
<text class="lbl" x="215" y="78" text-anchor="middle" dominant-baseline="central">Files</text>

<line class="arr" x1="271" y1="68" x2="286" y2="68" marker-end="url(#arrowhead)"/>

<rect class="box" x="290" y="40" width="100" height="56" rx="8"/>
<text class="num" x="340" y="58" text-anchor="middle" dominant-baseline="central">Step 3</text>
<text class="lbl" x="340" y="78" text-anchor="middle" dominant-baseline="central">Link files</text>

<line class="arr" x1="396" y1="68" x2="411" y2="68" marker-end="url(#arrowhead)"/>

<rect class="box" x="415" y="40" width="100" height="56" rx="8"/>
<text class="num" x="465" y="58" text-anchor="middle" dominant-baseline="central">Step 4</text>
<text class="lbl" x="465" y="78" text-anchor="middle" dominant-baseline="central">Experiments</text>

<line class="arr" x1="521" y1="68" x2="536" y2="68" marker-end="url(#arrowhead)"/>

<rect class="box" x="540" y="40" width="100" height="56" rx="8"/>
<text class="num" x="590" y="58" text-anchor="middle" dominant-baseline="central">Step 5</text>
<text class="lbl" x="590" y="78" text-anchor="middle" dominant-baseline="central">Protocol</text>
</svg>
