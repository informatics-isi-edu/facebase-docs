{%- assign link = include.full | default: include.src -%}
{%- capture img -%}<img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" width="{{ include.width | divided_by: 2 }}" class="img-responsive screenshot">{%- endcapture -%}
{%- if include.zoom or include.full -%}<a href="{{ link | relative_url }}" target="_blank">{{ img }}</a>{%- else -%}{{ img }}{%- endif -%}
